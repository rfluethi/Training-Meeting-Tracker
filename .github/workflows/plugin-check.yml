name: Plugin Check

on:
  # Plugin Check is slow (Docker plus WordPress boot). We run it only where
  # compliance really matters: on pull requests against main, before each
  # release (called by the release workflow), and manually. Pushes directly
  # to main only get the fast lint and tests jobs.
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Branch, tag or commit to check. Empty means the ref that triggered the run.'
        type: string
        required: false
        default: ''

concurrency:
  group: plugin-check-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Check exactly what ships: build the ZIP with the same script the
      # release uses and unpack it. The folder inside the ZIP carries the
      # plugin slug "training-meeting-tracker" (lowercase), which Plugin Check
      # needs for the text domain check. The repository name on GitHub is
      # "Training-Meeting-Tracker" and would not match.
      - name: Build and unpack plugin ZIP
        run: |
          bash bin/build-zip.sh
          mkdir -p /tmp/plugin-check
          unzip -q dist/*.zip -d /tmp/plugin-check

      - name: Run Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: '/tmp/plugin-check/training-meeting-tracker'
          # We leave out the wp.org distribution category (plugin_repo) because
          # this plugin is intentionally distributed via GitHub releases and
          # not through the wp.org plugin directory. All technical code
          # quality checks stay active. The i18n checks belong to "general"
          # since Plugin Check 2.x, a separate category no longer exists.
          categories: 'general,security,performance,accessibility'
