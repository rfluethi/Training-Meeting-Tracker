name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release again (for example v0.2.0). The tag has to contain bin/check-version.sh, so tags up to v0.1.2 do not work.'
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A release is only published when the tagged code passes the same checks
  # as a pull request.
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  plugin-check:
    uses: ./.github/workflows/plugin-check.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    name: Build ZIP and publish release
    needs: [ lint, tests, plugin-check ]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Passed through the environment, never interpolated into a script.
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Check that the tag matches the version numbers
        run: bash bin/check-version.sh "${TAG}"

      - name: Build plugin ZIP
        run: bash bin/build-zip.sh "${TAG#v}"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "ERROR: CHANGELOG.md has no notes for ${TAG#v}" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ASSET="dist/training-meeting-tracker-${TAG#v}.zip"

          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --clobber
            gh release edit "${TAG}" --notes-file release-notes.md
          else
            gh release create "${TAG}" "${ASSET}" \
              --verify-tag \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi
